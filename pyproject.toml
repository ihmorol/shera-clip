[project]
name = "shera-clip"
version = "0.1.0"
description = "Local tool that turns Rimons IELTS class recordings into reviewed portrait clips."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "httpx>=0.27", "python-multipart>=0.0.9", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
shera = "shera.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["shera"]
